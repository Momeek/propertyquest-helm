server:
  image: mohmeek/propertyquest-aws-monolithic-backend
  tag: latest
  replicas: 1
  containerPort: 8080
  servicePort: 8080
  defaultUser: meek_user

client:
  image: mohmeek/propertyquest-aws-monolithic-frontend
  tag: latest
  replicas: 2
  containerPort: 3000
  servicePort: 3000
  defaultUser: production

initcontainers:
  enabled: true
  image: busybox
  tag: latest
  databaseCommand:
    [
      "sh",
      "-c",
      "until nslookup mysql.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mysql; sleep 2; done",
    ]
  serverCommand:
    [
      "sh",
      "-c",
      "until nslookup server-service.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for server-service; sleep 2; done",
    ]

ingress:
  enabled: true
  host: propertyquest.meeklab.site
  servicePort: 3000

