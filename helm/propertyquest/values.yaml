app:
  name: propertyquest

server:
  image: mohmeek/propertyquest-aws-monolithic-backend
  tag: latest
  replicas: 1
  containerPort: 8080
  servicePort: 8080
  defaultUser: meek_user

client:
  image: mohmeek/propertyquest-aws-monolithic-frontend
  tag: latest
  replicas: 2
  containerPort: 3000
  servicePort: 3000
  defaultUser: production

initcontainers:
  enabled: true
  image: busybox
  tag: latest
  serverCommand:
    [
      "sh",
      "-c",
      "until nslookup server-service.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for server-service; sleep 2; done",
    ]

ingress:
  enabled: true
  host: propertyquest.meeklab.site
  servicePort: 3000

secrets:
  dbPassword: MTIzNDU2Nzg=
  jwtSecret: eW91ci1zZWNyZXQta2V5
  googleClientSecret: WU9VUl9HT09HTEVfQ0xJRU5UX1NFQ1JFVA==
  facebookClientSecret: eW91cl9mYWNlYm9va19hcHBfc2VjcmV0
  applePrivateKey: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tbi4uLi5uLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQ==
  adminSecretKey: c2VjcmV0dG9nbw==
  adminPassword: MTIzNDU2Nzg=

dockerregistry:
  enabled: false
  server: index.docker.io
  username: ""
  password: ""
  email: ""

database:
  host: propertyquest-db.cchii46suxaz.us-east-1.rds.amazonaws.com
  port: 3306
  name: propertyquest
  user: propertyquest_app
  ssl: true
  sslRejectUnauthorized: true

migration:
  enabled: true
  backoffLimit: 3
  command: ["npx"]
  args: ["sequelize-cli", "db:migrate"]
