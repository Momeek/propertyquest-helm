apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: propertyquest-external-secret
  namespace: propertyquest
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: propertyquest-secret-store
    kind: SecretStore
  target:
    name: propertyquest-secret  
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: propertyquest/application